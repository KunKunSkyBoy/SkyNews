name: skynews-relay

# 每 10 分钟抓一次官方动态 → docs/feed.json / feed.xml，由 GitHub Pages 提供。
# 稳定性要点（relay v2）：
#   * 每源独立超时 + 重试 3 次（指数退避+抖动），单源失败不拖累其它源；
#   * 某源本次失败时沿用上次成功条目（stale=true），条目不会凭空消失；
#   * 只有 feed 内容真的变化才 commit，避免每 10 分钟一次空提交；
#   * Actions 海外出口对 B 站常返回 412：默认跳过（SKYNEWS_BILI_CI=0），App 本地抓；
#     想强制在 CI 抓 B 站，设仓库变量 SKYNEWS_BILI_CI=1。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skynews-relay
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  # 源开关：tap=TapTap 官方帖、official=官网、bili=B站、weibo/douyin/xhs 见 relay/README.md
  SKYNEWS_SOURCES: "tap,official,bili,weibo,douyin,xhs"
  # CI 默认跳过 B 站（412）；要强制设为 1
  SKYNEWS_BILI_CI: "0"
  SKYNEWS_TIMEOUT: "8"
  SKYNEWS_RETRIES: "3"
  SKYNEWS_TOTAL_TIMEOUT: "60"
  # 可选通知（仓库 Secret NTFY_TOPIC，如 "skynews-xxxx"）
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 离线自检（schema/去重/失败回退，不联网）
        run: python3 relay/relay.py --self-test

      - name: 抓取并生成 feed（失败自动重试 3 轮）
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
        run: |
          set -e
          for i in 1 2 3; do
            echo "== 第 $i 轮抓取 =="
            if python3 relay/relay.py --out docs --print; then
              echo "抓取成功（第 $i 轮）"
              exit 0
            fi
            echo "抓取脚本异常，$((i*10))s 后重试"
            sleep $((i*10))
          done
          echo "三种尝试均失败（脚本级异常）"; exit 1

      - name: 写入 workflow 摘要（各源健康状态）
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = os.path.join("docs", "feed.json")
          print("### SkyNews relay 摘要\n")
          if not os.path.exists(p):
              print("❌ 未生成 docs/feed.json")
              raise SystemExit(0)
          d = json.load(open(p, encoding="utf-8"))
          print("schema=%s · items=%d · generated_at=%s\n" % (d.get("schema"), d.get("count"), d.get("generated_at")))
          print("| 源 | ok | count | 耗时 | 备注 |")
          print("|---|---|---|---|---|")
          for name, m in sorted((d.get("sources") or {}).items()):
              err = (m.get("error") or "").replace("|", "/")[:80]
              print("| %s | %s | %s | %sms | %s |" % (name, "✅" if m.get("ok") else "❌", m.get("count", 0), m.get("elapsed_ms", 0), err))
          stale = [i for i in d.get("items") or [] if i.get("stale")]
          if stale:
              print("\n> ⚠️ 有 %d 条 stale（来自上次成功缓存）" % len(stale))
          PY

      - name: 内容变化才提交
        run: |
          set -e
          git config user.name "skynews-relay"
          git config user.email "relay@users.noreply.github.com"
          # 只跟踪 feed 产物（避免 docs 目录下其它文件被误提交）
          git add docs/feed.json docs/feed.xml
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
            exit 0
          fi
          git commit -m "relay: $(date -u +%FT%TZ) $(python3 -c 'import json;d=json.load(open("docs/feed.json",encoding="utf-8"));print("items=%d"%d.get("count",0))')"
          # 并发/远端更新时 rebase 后重试
          for i in 1 2 3; do
            if git push; then echo "push ok"; exit 0; fi
            echo "push 失败，尝试 pull --rebase 后重试($i)"
            sleep $((i*5))
            git pull --rebase --autostash || true
          done
          echo "push 重试均失败"; exit 1

      - name: 失败通知（可选 ntfy）
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          curl -fsS -m 15 \
            -H "Title: SkyNews relay 失败" \
            -H "Tags: warning" \
            -d "workflow 失败：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true

      - name: 保留本次 feed 作为 artifact（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-${{ github.run_id }}
          path: docs/feed.json
          if-no-files-found: warn
          retention-days: 3
