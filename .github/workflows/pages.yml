name: pages

# 用 GitHub Actions 部署 docs/ 到 GitHub Pages（替代 legacy Pages 构建，避免 "Page build failed"）
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  # relay 用 GITHUB_TOKEN 提交 docs 时不会再触发 push 事件，这里在 relay 跑完后补一次部署
  workflow_run:
    workflows: ["skynews-relay"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
